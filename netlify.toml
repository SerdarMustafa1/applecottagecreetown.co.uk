[build]
  # Deterministic install when lockfile exists; then verify CDN URLs before build
  command = "if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi && npm run check:cdn && npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/floorplans/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/panos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/*"
  [headers.values]
    # Docs may change; cache for a day
    Cache-Control = "public, max-age=86400"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_USE_NPM = "true"
  NPM_FLAGS = "--no-audit --no-fund"
  # Ensure prod uses the same media base as local/dev
  MEDIA_BASE_URL = "https://d1t6lpjdsu4646.cloudfront.net"
