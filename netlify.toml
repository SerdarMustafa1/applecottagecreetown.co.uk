[build]
  # Deterministic install when lockfile exists; then verify CDN URLs before build
  # NOTE: Avoid npm ci due to npm optional-deps bug affecting Rollup native binaries on Linux.
  # See: https://github.com/npm/cli/issues/4828 and Netlify logs "Cannot find module @rollup/rollup-linux-x64-gnu".
  # Always use npm install here to ensure optional platform binaries are fetched.
  # Triggered: 2025-09-15
  # Also force a clean install to avoid stale cached node_modules from macOS being reused on Linux runners.
  command = "rm -rf node_modules && npm install --no-audit --no-fund && npm run check:cdn && npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/floorplans/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/panos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/*"
  [headers.values]
    # Docs may change; cache for a day
    Cache-Control = "public, max-age=86400"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_USE_NPM = "true"
  NPM_FLAGS = "--no-audit --no-fund"
  # Ensure prod uses the same media base as local/dev
  MEDIA_BASE_URL = "https://d1t6lpjdsu4646.cloudfront.net"
  # Workarounds for Rollup native binary resolution issues on Linux
  ROLLUP_DISABLE_NATIVE = "1"
  # Ensure a clean cache in case Netlify reuses previous node_modules
  NPM_CONFIG_PREFER_OFFLINE = "false"

# Proxy CDN through same-origin path to enable CORS for libraries that use XHR (e.g. Pannellum)
[[redirects]]
  from = "/proxy-cdn/*"
  to = "https://d1t6lpjdsu4646.cloudfront.net/:splat"
  status = 200
  force = true

[[headers]]
  for = "/proxy-cdn/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "*"
