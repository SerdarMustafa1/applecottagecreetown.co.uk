name: Tests (CDN + E2E)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, copilot/**, feature/**]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Install Playwright browsers
        continue-on-error: true
        id: playwright-install
        run: npx playwright install --with-deps
      - name: Run CDN verification (skip webm and some responsive sizes)
        env:
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          VERIFY_SKIP_WEBM: "1"
          VERIFY_SKIP_PATHS: "exteriormain-480,exteriormain-800"
        run: |
          if [ -n "${MEDIA_BASE_URL}" ]; then
            echo "Testing CDN at $MEDIA_BASE_URL";
            npm run test:cdn;
          else
            echo "MEDIA_BASE_URL not set; skipping CDN test";
          fi
      - name: Serve site locally for E2E
        run: |
          nohup npx http-server -p 8080 -c-1 . >/dev/null 2>&1 &
          sleep 2
      - name: Run E2E playback tests (limit to known working if env set)
        env:
          SITE_URL: http://127.0.0.1:8080
          # Set to lounge360 while other 360 variants upload; remove later
          E2E_VIEWERS: lounge360
        run: npm run test:e2e
