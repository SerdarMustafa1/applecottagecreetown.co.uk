name: Lighthouse CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Use npm 11.4.2
        run: |
          npm i -g npm@11.4.2
          npm --version
      - name: Clean lockfile (workaround optional deps bug)
        run: |
          rm -f package-lock.json
          npm cache clean --force
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx lighthouse-ci --config=lighthouse.config.js
