name: Lighthouse CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: npx -y pnpm@10.13.1 install --frozen-lockfile
      - run: npx -y pnpm@10.13.1 build
      - run: npx lighthouse-ci --config=lighthouse.config.js
