name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install
      - run: pnpm build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Serve and run Playwright tests
        env:
          SITE_URL: http://127.0.0.1:8080
        run: |
          npx http-server -p 8080 -c-1 dist &
          sleep 2
          npx playwright test -c tests/playwright.config.js tests/site-flows.e2e.spec.js
