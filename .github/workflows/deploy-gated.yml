name: Deploy (Gated by Tests)

on:
  push:
    branches: [ main ]

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [ test ]
    if: ${{ needs.test.result == 'success' }}
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK not set; skipping deploy"; exit 0;
          fi
          curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "Netlify build triggered."

